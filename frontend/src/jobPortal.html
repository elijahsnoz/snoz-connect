<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Welcome to the Job Portal</h1>

  <!-- Job Seeker Profile Form -->
  <h2>Job Seeker Profile Creation</h2>
  <form id="jobSeekerForm">
    <input type="text" id="seekerName" placeholder="Your Name" required />
    <textarea id="seekerSkills" placeholder="Skills (e.g., Solidity, React)" required></textarea>
    <textarea id="seekerExperience" placeholder="Experience" required></textarea>
    <input type="url" id="seekerPortfolio" placeholder="Portfolio URL (GitHub, IPFS)" required />
    <button type="submit">Create Profile</button>
  </form>

  <!-- Employer Profile Form -->
  <h2>Employer Profile Creation</h2>
  <form id="employerForm">
    <input type="text" id="employerName" placeholder="Company Name" required />
    <input type="text" id="jobTitle" placeholder="Job Title" required />
    <textarea id="jobDescription" placeholder="Job Description" required></textarea>
    <input type="text" id="jobSkills" placeholder="Skills Required (e.g., Solidity, Web3)" required />
    <button type="submit">Post Job</button>
  </form>

  <!-- Job Search -->
  <h2>Job Search</h2>
  <form id="jobSearchForm">
    <input type="text" id="searchKeywords" placeholder="Search for jobs (e.g., Blockchain Developer)" />
    <button type="submit">Search Jobs</button>
  </form>

  <!-- Dashboard (Profile Display) -->
  <div id="dashboard">
    <h2>Your Dashboard</h2>
    <h3>Job Seeker Profile</h3>
    <p id="seekerProfile"></p>
    <h3>Employer Job Listings</h3>
    <ul id="jobListings"></ul>
    <h3>Applications</h3>
    <ul id="applications"></ul>
  </div>

  <script src="jobPortal.js"></script>
</body>
</html>
